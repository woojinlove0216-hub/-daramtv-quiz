<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈 앱</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Malgun Gothic',sans-serif; background:#f5f5f5; min-height:100vh; }
        .header { background:white; padding:15px 20px; box-shadow:0 2px 10px rgba(0,0,0,.1); display:flex; justify-content:space-between; align-items:center; }
        .header h1 { font-size:1.5em; }
        .btn { padding:10px 20px; border:none; border-radius:8px; cursor:pointer; font-size:1em; }
        .btn-primary { background:#4f46e5; color:white; }
        .btn-secondary { background:#e5e7eb; color:#333; }
        .btn-danger { background:#ef4444; color:white; }
        .btn-success { background:#22c55e; color:white; }
        .container { max-width:900px; margin:20px auto; padding:0 20px; }
        .hidden { display:none !important; }
        .quiz-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:20px; margin-top:20px; }
        .quiz-card { background:white; border-radius:15px; padding:20px; cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.08); }
        .quiz-card h3 { color:#4f46e5; margin-bottom:8px; }
        .quiz-card p { color:#666; font-size:.9em; }
        .modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; justify-content:center; align-items:center; z-index:100; }
        .modal-content { background:white; padding:30px; border-radius:15px; width:90%; max-width:500px; }
        .modal-content input, .modal-content textarea { width:100%; padding:12px; margin:8px 0; border:2px solid #e5e7eb; border-radius:8px; font-size:1em; }
        .quiz-screen { background:white; border-radius:15px; padding:30px; margin:15px 0; text-align:center; }
        .quiz-screen img { max-width:100%; max-height:400px; border-radius:10px; margin:15px 0; }
        .progress-bar { width:100%; height:8px; background:#e5e7eb; border-radius:4px; margin:15px 0; }
        .progress { height:100%; background:#4f46e5; border-radius:4px; transition:.3s; }
        .answer-row { display:flex; gap:10px; margin-top:15px; }
        .answer-row input { flex:1; padding:14px; border:2px solid #e5e7eb; border-radius:10px; font-size:1.1em; }
        .feedback { padding:12px; border-radius:8px; margin-top:15px; font-size:1.1em; text-align:center; }
        .feedback.correct { background:#dcfce7; color:#166534; }
        .feedback.wrong { background:#fee2e2; color:#991b1b; }
        .result-box { text-align:center; padding:40px; background:linear-gradient(135deg,#4f46e5,#7c3aed); color:white; border-radius:15px; margin:20px 0; }
        .result-box h2 { font-size:3em; }
        .problem-item { background:white; padding:15px; border-radius:10px; margin:10px 0; display:flex; justify-content:space-between; align-items:center; }
        .problem-item img { max-width:80px; max-height:60px; border-radius:5px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 퀴즈 앱</h1>
        <div>
            <button class="btn btn-secondary" id="admin-btn" onclick="openModal('password-modal')">관리자</button>
            <button class="btn btn-danger hidden" id="logout-btn" onclick="logoutAdmin()">로그아웃</button>
        </div>
    </div>

    <div class="container">
        <section id="quiz-list">
            <h2>📚 퀴즈 목록</h2>
            <div id="quiz-grid" class="quiz-grid"></div>
        </section>

        <section id="quiz-play" class="hidden">
            <button class="btn btn-secondary" onclick="showView('quiz-list')">← 목록</button>
            <div class="progress-bar"><div id="progress" class="progress"></div></div>
            <div id="problem-display" class="quiz-screen"></div>
            <div class="answer-row">
                <input type="text" id="answer-input" placeholder="정답 입력...">
                <button class="btn btn-primary" onclick="submitAnswer()">제출</button>
            </div>
            <div id="feedback" class="feedback hidden"></div>
        </section>

        <section id="quiz-result" class="hidden">
            <div id="result-content" class="result-box"></div>
            <button class="btn btn-secondary" onclick="showView('quiz-list')">목록으로</button>
        </section>

        <section id="admin-panel" class="hidden">
            <h2>⚙️ 관리자 패널</h2>
            <button class="btn btn-primary" onclick="openModal('create-modal')">+ 새 퀴즈</button>
            <div id="admin-grid" class="quiz-grid"></div>
        </section>

        <section id="quiz-detail" class="hidden">
            <button class="btn btn-secondary" onclick="showView('admin-panel')">← 뒤로</button>
            <div id="detail-info" style="background:white;padding:20px;border-radius:15px;margin:15px 0;"></div>
            <button class="btn btn-primary" onclick="openModal('problem-modal')">+ 문제 추가</button>
            <div id="problem-list"></div>
        </section>
    </div>

    <div id="password-modal" class="modal hidden">
        <div class="modal-content">
            <h2>🔐 관리자 로그인</h2>
            <input type="password" id="admin-password" placeholder="비밀번호">
            <div style="margin-top:15px;">
                <button class="btn btn-primary" onclick="checkPassword()">확인</button>
                <button class="btn btn-secondary" onclick="closeModal('password-modal')">취소</button>
            </div>
        </div>
    </div>

    <div id="create-modal" class="modal hidden">
        <div class="modal-content">
            <h2>새 퀴즈</h2>
            <input type="text" id="new-title" placeholder="제목">
            <textarea id="new-desc" placeholder="설명"></textarea>
            <div style="margin-top:15px;">
                <button class="btn btn-primary" onclick="createQuiz()">생성</button>
                <button class="btn btn-secondary" onclick="closeModal('create-modal')">취소</button>
            </div>
        </div>
    </div>

    <div id="problem-modal" class="modal hidden">
        <div class="modal-content">
            <h2>문제 추가</h2>
            <input type="text" id="p-question" placeholder="질문">
            <input type="text" id="p-image" placeholder="이미지 URL">
            <input type="text" id="p-answer" placeholder="정답 (쉼표로 복수)">
            <div style="margin-top:15px;">
                <button class="btn btn-primary" onclick="addProblem()">추가</button>
                <button class="btn btn-secondary" onclick="closeModal('problem-modal')">취소</button>
            </div>
        </div>
    </div>

    <script>
        const API = '/api';
        const ADMIN_PASSWORD = 'admin1234';
        let currentQuiz = null;
        let problems = [];
        let idx = 0, score = 0;

        function showView(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if (id === 'quiz-list') loadQuizzes();
            if (id === 'admin-panel') loadAdmin();
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function checkPassword() {
            const pw = document.getElementById('admin-password').value;
            if (pw === ADMIN_PASSWORD) {
                closeModal('password-modal');
                document.getElementById('admin-btn').classList.add('hidden');
                document.getElementById('logout-btn').classList.remove('hidden');
                showView('admin-panel');
            } else {
                alert('비밀번호가 틀렸습니다!');
            }
            document.getElementById('admin-password').value = '';
        }

        function logoutAdmin() {
            document.getElementById('admin-btn').classList.remove('hidden');
            document.getElementById('logout-btn').classList.add('hidden');
            showView('quiz-list');
        }

        async function loadQuizzes() {
            const res = await fetch(`${API}/quizzes`);
            const quizzes = await res.json();
            const grid = document.getElementById('quiz-grid');
            grid.innerHTML = '';
            const pub = quizzes.filter(q => q.published);
            if (!pub.length) {
                grid.innerHTML = '<p style="color:#666;">아직 퀴즈가 없습니다.</p>';
                return;
            }
            pub.forEach(q => {
                const c = document.createElement('div');
                c.className = 'quiz-card';
                c.innerHTML = `<h3>${q.title}</h3><p>${q.description}</p><p>문제 ${q.problems.length}개</p>`;
                c.onclick = () => startQuiz(q);
                grid.appendChild(c);
            });
        }

        async function startQuiz(q) {
            const res = await fetch(`${API}/quizzes`);
            const all = await res.json();
            currentQuiz = all.find(x => x.id === q.id);
            problems = currentQuiz.problems;
            idx = 0; score = 0;
            showProblem();
            showView('quiz-play');
        }

        function showProblem() {
            const p = problems[idx];
            document.getElementById('progress').style.width = `${((idx+1)/problems.length)*100}%`;
            document.getElementById('problem-display').innerHTML = `
                <h3>문제 ${idx+1}/${problems.length}</h3>
                <p style="font-size:1.2em;margin:10px 0;">${p.question}</p>
                ${p.image ? `<img src="${p.image}">` : ''}`;
            document.getElementById('answer-input').value = '';
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('answer-input').focus();
        }

        function submitAnswer() {
            const a = document.getElementById('answer-input').value.trim().toLowerCase();
            const p = problems[idx];
            const correct = p.answer.split(',').map(x => x.trim().toLowerCase());
            const f = document.getElementById('feedback');
            f.classList.remove('hidden');
            if (correct.includes(a)) {
                score++;
                f.textContent = '✅ 정답!';
                f.className = 'feedback correct';
            } else {
                f.textContent = `❌ 오답! 정답: ${p.answer}`;
                f.className = 'feedback wrong';
            }
            setTimeout(() => {
                idx++;
                if (idx < problems.length) showProblem();
                else showResult();
            }, 1500);
        }

        function showResult() {
            const pct = Math.round((score/problems.length)*100);
            document.getElementById('result-content').innerHTML = 
                `<h2>${pct}%</h2><p>${score}/${problems.length} 정답</p>`;
            showView('quiz-result');
        }

        async function loadAdmin() {
            const res = await fetch(`${API}/quizzes`);
            const quizzes = await res.json();
            const grid = document.getElementById('admin-grid');
            grid.innerHTML = '';
            quizzes.forEach(q => {
                const c = document.createElement('div');
                c.className = 'quiz-card';
                c.innerHTML = `<h3>${q.title}</h3><p>${q.description}</p>
                    <p>문제 ${q.problems.length}개</p>
                    <span style="color:${q.published?'#22c55e':'#f59e0b'};font-weight:bold;">
                    ${q.published?'✅ 공개':'📝 비공개'}</span>`;
                c.onclick = () => showDetail(q);
                grid.appendChild(c);
            });
        }

        async function createQuiz() {
            const title = document.getElementById('new-title').value.trim();
            const description = document.getElementById('new-desc').value.trim();
            if (!title) { alert('제목 입력!'); return; }
            await fetch(`${API}/quizzes`, {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({title, description})
            });
            closeModal('create-modal');
            document.getElementById('new-title').value = '';
            document.getElementById('new-desc').value = '';
            loadAdmin();
        }

        function showDetail(q) {
            currentQuiz = q;
            document.getElementById('detail-info').innerHTML = `
                <h2>${q.title}</h2><p>${q.description}</p>
                <button class="btn ${q.published?'btn-danger':'btn-success'}" onclick="togglePublish()">
                ${q.published?'비공개로':'공개하기'}</button>
                <button class="btn btn-danger" onclick="deleteQuiz()">삭제</button>`;
            loadProblems();
            showView('quiz-detail');
        }

        async function togglePublish() {
            await fetch(`${API}/quizzes/${currentQuiz.id}`, {
                method: 'PUT',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({published: !currentQuiz.published})
            });
            loadAdmin();
        }

        async function deleteQuiz() {
            if (!confirm('삭제?')) return;
            await fetch(`${API}/quizzes/${currentQuiz.id}`, {method:'DELETE'});
            showView('admin-panel');
        }

        async function addProblem() {
            const question = document.getElementById('p-question').value.trim();
            const image = document.getElementById('p-image').value.trim();
            const answer = document.getElementById('p-answer').value.trim();
            if (!question || !answer) { alert('질문과 정답 필수!'); return; }
            await fetch(`${API}/quizzes/${currentQuiz.id}/problems`, {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({question, image, answer})
            });
            closeModal('problem-modal');
            document.getElementById('p-question').value = '';
            document.getElementById('p-image').value = '';
            document.getElementById('p-answer').value = '';
            loadProblems();
        }

        async function loadProblems() {
            const res = await fetch(`${API}/quizzes`);
            const all = await res.json();
            const q = all.find(x => x.id === currentQuiz.id);
            const el = document.getElementById('problem-list');
            el.innerHTML = '';
            q.problems.forEach((p, i) => {
                const d = document.createElement('div');
                d.className = 'problem-item';
                d.innerHTML = `<div><b>#${i+1}</b> ${p.question}
                    ${p.image ? `<br><img src="${p.image}">` : ''}
                    <br><small>정답: ${p.answer}</small></div>
                    <button class="btn btn-danger" onclick="deleteProblem(${p.id})">삭제</button>`;
                el.appendChild(d);
            });
        }

        async function deleteProblem(pid) {
            await fetch(`${API}/quizzes/${currentQuiz.id}/problems/${pid}`, {method:'DELETE'});
            loadProblems();
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('answer-input').addEventListener('keypress', e => {
                if (e.key === 'Enter') submitAnswer();
            });
            document.getElementById('admin-password').addEventListener('keypress', e => {
                if (e.key === 'Enter') checkPassword();
            });
            showView('quiz-list');
        });
    </script>
</body>
</html>
